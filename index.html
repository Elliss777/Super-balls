<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Супер Шарики</title>
<style>
:root{ --face:#c3d1b4; --face-hi:#f2f7ea; --face-lo:#6f7f62; --ink:#1d2418; --t1:#2b4a2e; --t2:#6c9a5f; --lcd:#ffe36b; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --face:#3a4834; --face-hi:#5c6e55; --face-lo:#161d13; --ink:#e6eedb; --t1:#14261a; --t2:#2f5a3a; }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:#16241a; min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:max(12px, env(safe-area-inset-top,0px)) 12px max(12px, env(safe-area-inset-bottom,0px));
  font-family:"Trebuchet MS", Verdana, sans-serif; color:var(--ink);
}
.win{ background:var(--face); padding:4px; border:2px solid; border-color:var(--face-hi) var(--face-lo) var(--face-lo) var(--face-hi); max-width:100%; width:fit-content; }
.title{ background:linear-gradient(90deg,var(--t1),var(--t2)); color:#fff; font-weight:bold; font-size:14px; padding:3px 8px; text-align:center; }
.menu{ display:flex; gap:14px; padding:4px 6px; font-size:13px; border-bottom:1px solid var(--face-lo); }
.menu button{ background:none; border:0; color:var(--ink); font:inherit; cursor:pointer; padding:0; text-decoration:underline; }
.body{ display:flex; gap:10px; padding:8px 6px; flex-wrap:wrap; justify-content:center; }
.field{ background:#050805; padding:3px; border:2px solid; border-color:var(--face-lo) var(--face-hi) var(--face-hi) var(--face-lo); }
canvas{ display:block; width:416px; max-width:100%; height:auto; cursor:pointer; touch-action:manipulation; }
.panel{ width:150px; display:flex; flex-direction:column; gap:6px; font-size:13px; }
.lbl{ background:var(--face); border:1px solid var(--face-lo); text-align:center; font-weight:bold; padding:2px; }
.val{ background:#0b140c; color:var(--lcd); font-family:"Courier New", monospace; font-size:17px; font-weight:bold; text-align:right; padding:3px 8px; border:1px solid var(--face-lo); }
button.btn, select{ background:var(--face); color:var(--ink); border:2px solid; border-color:var(--face-hi) var(--face-lo) var(--face-lo) var(--face-hi); font:inherit; font-size:13px; padding:5px 6px; cursor:pointer; width:100%; }
button.btn:active{ border-color:var(--face-lo) var(--face-hi) var(--face-hi) var(--face-lo); }
button.btn:disabled{ opacity:.5; cursor:default; }
button.btn.on{ background:var(--t2); color:#fff; }
.status{ font-size:12px; padding:5px 8px; border-top:1px solid var(--face-lo); min-height:26px; }
:focus-visible{ outline:2px dotted var(--ink); outline-offset:2px; }
</style>
</head>
<body>
<div class="win">
  <div class="title">Супер Шарики</div>
  <div class="menu">
    <button id="mNew">Игра</button>
    <button id="help">Помощь</button>
  </div>
  <div class="body">
    <div class="field"><canvas id="field"></canvas></div>
    <div class="panel">
      <div><div class="lbl">Рекорд</div><div class="val" id="rec">0</div></div>
      <div><div class="lbl">Время</div><div class="val" id="time">0</div></div>
      <div><div class="lbl">Очки</div><div class="val" id="score">0</div></div>
      <div><div class="lbl">Бомбы</div><button class="btn" id="bombBtn">Бомбы: 3</button></div>
      <div><div class="lbl">Уровень</div>
        <select id="diff">
          <option value="Легкая">Легкая</option>
          <option value="Средняя">Средняя</option>
          <option value="Трудная">Трудная</option>
        </select>
      </div>
      <button class="btn" id="newBtn">Новая игра</button>
      <button class="btn" id="pauseBtn">Пауза</button>
      <button class="btn" id="endBtn">Завершить игру</button>
    </div>
  </div>
  <div class="status" id="status"></div>
</div>

<script>
const N = 8, CELL = 52;
const CFG = {
  'Легкая':  { time: 140, colors: 5 },
  'Средняя': { time: 120, colors: 6 },
  'Трудная': { time: 100, colors: 7 }
};
const PAL = [
  { base:'#c08a55', dark:'#5a3a1e' }, // коричневый
  { base:'#3b8cff', dark:'#153d8a' }, // синий
  { base:'#ff4a3d', dark:'#7a120d' }, // красный
  { base:'#38d25c', dark:'#135c24' }, // зелёный
  { base:'#ffe03a', dark:'#8a6d00' }, // жёлтый
  { base:'#a855f7', dark:'#3f1670' }, // фиолетовый
  { base:'#ff4fd8', dark:'#7a1a5e' }  // розовый
];

const cv = document.getElementById('field');
const ctx = cv.getContext('2d');
const DPR = Math.max(2, window.devicePixelRatio || 1);
function sizeCanvas() { cv.width = N * CELL * DPR; cv.height = N * CELL * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
sizeCanvas();

let S = null;
let record = 0;

const rnd = n => Math.floor(Math.random() * n);
const idx = (r, c) => r * N + c;
const sleep = ms => new Promise(res => setTimeout(res, ms));
const swap = (b, i, j) => { const t = b[i]; b[i] = b[j]; b[j] = t; };

function adjacent(a, b) {
  const ar = Math.floor(a / N), ac = a % N, br = Math.floor(b / N), bc = b % N;
  return Math.abs(ar - br) + Math.abs(ac - bc) === 1;
}

function findRuns(b) {
  const runs = [];
  for (let r = 0; r < N; r++) {
    let c = 0;
    while (c < N) {
      const v = b[idx(r, c)];
      if (v < 0) { c++; continue; }
      let e = c;
      while (e + 1 < N && b[idx(r, e + 1)] === v) e++;
      if (e - c + 1 >= 3) {
        const cells = [];
        for (let k = c; k <= e; k++) cells.push(idx(r, k));
        runs.push(cells);
      }
      c = e + 1;
    }
  }
  for (let c = 0; c < N; c++) {
    let r = 0;
    while (r < N) {
      const v = b[idx(r, c)];
      if (v < 0) { r++; continue; }
      let e = r;
      while (e + 1 < N && b[idx(e + 1, c)] === v) e++;
      if (e - r + 1 >= 3) {
        const cells = [];
        for (let k = r; k <= e; k++) cells.push(idx(k, c));
        runs.push(cells);
      }
      r = e + 1;
    }
  }
  return runs;
}

function hasMoves(b) {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const i = idx(r, c);
    for (const [dr, dc] of [[0, 1], [1, 0]]) {
      const nr = r + dr, nc = c + dc;
      if (nr >= N || nc >= N) continue;
      const j = idx(nr, nc);
      swap(b, i, j);
      const ok = findRuns(b).length > 0;
      swap(b, i, j);
      if (ok) return true;
    }
  }
  return false;
}

function makeBoard(k) {
  let b;
  do {
    b = new Array(N * N);
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      let v;
      do {
        v = rnd(k);
      } while (
        (c >= 2 && b[idx(r, c - 1)] === v && b[idx(r, c - 2)] === v) ||
        (r >= 2 && b[idx(r - 1, c)] === v && b[idx(r - 2, c)] === v)
      );
      b[idx(r, c)] = v;
    }
  } while (!hasMoves(b));
  return b;
}

function gravity(b, k) {
  for (let c = 0; c < N; c++) {
    let write = N - 1;
    for (let r = N - 1; r >= 0; r--) {
      const v = b[idx(r, c)];
      if (v >= 0) { b[idx(write, c)] = v; write--; }
    }
    for (let r = write; r >= 0; r--) b[idx(r, c)] = rnd(k);
  }
}

function checkBonus() {
  while (S.score >= S.nextBomb) { S.bombs++; S.nextBomb += 1000; }
}

async function resolve() {
  let chain = 0;
  while (true) {
    const runs = findRuns(S.board);
    if (!runs.length) break;
    const set = new Set();
    runs.forEach(run => run.forEach(i => set.add(i)));
    S.score += set.size * 10 * (chain + 1);
    if (chain > 0) setStatus('Комбо x' + (chain + 1) + '!');
    set.forEach(i => { S.board[i] = -1; });
    checkBonus();
    updateUI(); render();
    await sleep(260);
    gravity(S.board, S.colors);
    render();
    await sleep(200);
    chain++;
  }
}

async function trySwap(a, b) {
  S.busy = true;
  swap(S.board, a, b);
  render();
  await sleep(140);
  if (!findRuns(S.board).length) {
    swap(S.board, a, b);
    S.busy = false;
    render();
    setStatus('Такой ход не даёт совпадения');
    return;
  }
  await resolve();
  afterMove();
}

async function explode(i) {
  S.busy = true;
  const r = Math.floor(i / N), c = i % N;
  const set = new Set();
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    const nr = r + dr, nc = c + dc;
    if (nr >= 0 && nr < N && nc >= 0 && nc < N && S.board[idx(nr, nc)] >= 0) set.add(idx(nr, nc));
  }
  S.score += set.size * 10;
  set.forEach(j => { S.board[j] = -1; });
  checkBonus();
  setStatus('Бум! Удалено шаров: ' + set.size);
  updateUI(); render();
  await sleep(220);
  gravity(S.board, S.colors);
  render();
  await sleep(200);
  await resolve();
  afterMove();
}

function afterMove() {
  if (!hasMoves(S.board)) {
    S.board = makeBoard(S.colors);
    setStatus('Ходов не осталось — поле перемешано');
  }
  S.busy = false;
  updateUI();
  render();
}

function render() {
  ctx.fillStyle = '#050a06';
  ctx.fillRect(0, 0, N * CELL, N * CELL);
  if (!S || !S.board) return;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    ctx.fillStyle = (r + c) % 2 ? '#0b130d' : '#070e09';
    ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
    const v = S.board[idx(r, c)];
    if (v < 0) continue;
    drawBall(c * CELL + CELL / 2, r * CELL + CELL / 2, CELL / 2 - 5, PAL[v]);
    if (S.sel === idx(r, c)) {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(c * CELL + CELL / 2, r * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  if (S.bombMode) {
    ctx.fillStyle = 'rgba(255,227,107,0.12)';
    ctx.fillRect(0, 0, N * CELL, N * CELL);
  }
  if (S.paused || S.over) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, N * CELL, N * CELL);
    ctx.fillStyle = '#ffe36b';
    ctx.font = 'bold 30px "Trebuchet MS", Verdana, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(S.over ? 'КОНЕЦ ИГРЫ' : 'ПАУЗА', (N * CELL) / 2, (N * CELL) / 2);
  }
}

function mix(a, b, t) {
  const ca = [parseInt(a.slice(1, 3), 16), parseInt(a.slice(3, 5), 16), parseInt(a.slice(5, 7), 16)];
  const cb = [parseInt(b.slice(1, 3), 16), parseInt(b.slice(3, 5), 16), parseInt(b.slice(5, 7), 16)];
  return 'rgb(' + ca.map((v, i) => Math.round(v + (cb[i] - v) * t)).join(',') + ')';
}

function drawBall(x, y, r, p) {
  // Чёткий контур без тени снизу, контур смягчён на 7%
  const rim = mix(p.dark, p.base, 0.07);
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = rim; ctx.fill();
  ctx.beginPath(); ctx.arc(x, y, r - 1.5, 0, Math.PI * 2);
  ctx.fillStyle = p.base; ctx.fill();
  ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.32, r * 0.24, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill();
  ctx.beginPath(); ctx.arc(x - r * 0.36, y - r * 0.38, r * 0.1, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff'; ctx.fill();
}

function updateUI() {
  if (!S) return;
  document.getElementById('rec').textContent = String(Math.max(record, S.score)).padStart(5, '0');
  document.getElementById('time').textContent = String(S.time).padStart(3, '0');
  document.getElementById('score').textContent = String(S.score).padStart(5, '0');
  const bb = document.getElementById('bombBtn');
  bb.textContent = S.bombMode ? 'Выберите шар' : 'Бомбы: ' + S.bombs;
  bb.classList.toggle('on', S.bombMode);
  bb.disabled = S.over || S.paused || S.busy || (S.bombs <= 0 && !S.bombMode);
  document.getElementById('pauseBtn').textContent = S.paused ? 'Продолжить' : 'Пауза';
}

function setStatus(t) { document.getElementById('status').textContent = t; }

function tick() {
  if (!S || S.paused || S.over) return;
  S.time--;
  if (S.time <= 0) { S.time = 0; endGame('Время вышло.'); return; }
  updateUI();
}

function endGame(msg) {
  S.over = true;
  S.sel = -1;
  S.bombMode = false;
  clearInterval(S.timer);
  record = Math.max(record, S.score);
  setStatus(msg + ' Очки: ' + S.score);
  updateUI(); render();
}

function newGame() {
  clearInterval(S && S.timer);
  const cfg = CFG[document.getElementById('diff').value];
  S = {
    board: null, colors: cfg.colors, sel: -1, busy: false, paused: false, over: false,
    score: 0, time: cfg.time, bombs: 3, nextBomb: 1000, bombMode: false, timer: null
  };
  S.board = makeBoard(S.colors);
  S.timer = setInterval(tick, 1000);
  setStatus('Соединяйте три и больше шариков одного цвета.');
  updateUI(); render();
}

function togglePause() {
  if (!S || S.over) return;
  S.paused = !S.paused;
  setStatus(S.paused ? 'Пауза. Нажмите «Продолжить».' : 'Игра продолжается.');
  updateUI(); render();
}

cv.addEventListener('click', e => {
  if (!S || S.over || S.paused || S.busy) return;
  const rect = cv.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (N * CELL / rect.width);
  const y = (e.clientY - rect.top) * (N * CELL / rect.height);
  const c = Math.floor(x / CELL), r = Math.floor(y / CELL);
  if (r < 0 || c < 0 || r >= N || c >= N) return;
  const i = idx(r, c);

  if (S.bombMode) {
    S.bombMode = false;
    if (S.bombs > 0) { S.bombs--; explode(i); }
    updateUI(); render();
    return;
  }
  if (S.sel < 0) { S.sel = i; render(); return; }
  if (i === S.sel) { S.sel = -1; render(); return; }
  if (adjacent(S.sel, i)) {
    const a = S.sel;
    S.sel = -1;
    trySwap(a, i);
  } else {
    S.sel = i;
    render();
  }
});

document.getElementById('newBtn').addEventListener('click', newGame);
document.getElementById('mNew').addEventListener('click', newGame);
document.getElementById('diff').addEventListener('change', newGame);
document.getElementById('pauseBtn').addEventListener('click', togglePause);
document.getElementById('endBtn').addEventListener('click', () => { if (S && !S.over) endGame('Игра завершена.'); });
document.getElementById('help').addEventListener('click', () => setStatus('Выберите шар, затем соседний, чтобы поменять их местами. Бомба очищает 3×3 вокруг выбранного шара. +1 бомба за каждые 1000 очков.'));
document.getElementById('bombBtn').addEventListener('click', () => {
  if (!S || S.over || S.paused || S.busy) return;
  if (!S.bombMode && S.bombs <= 0) return;
  S.bombMode = !S.bombMode;
  S.sel = -1;
  setStatus(S.bombMode ? 'Выберите шар, по которому ударить бомбой.' : '');
  updateUI(); render();
});

newGame();
</script>
</body>
</html>
